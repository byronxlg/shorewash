name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML links resolve
        run: |
          set -e
          for f in index.html privacy.html accessibility.html thanks.html 404.html; do
            for ref in $(grep -o 'href="[^"#h][^"]*"\|src="[^"h][^"]*"' "$f" | sed 's/.*="\(.*\)"/\1/' | sort -u); do
              [ -f "$ref" ] || { echo "$f: missing $ref"; exit 1; }
            done
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
